<!DOCTYPE html>

<html>

    <style>:root {
  --background-color: #f4f5f7;
  --panel: #ffffff;
  --ink: #1f2329;
  --muted: #8b929c;
  --line: #ececf0;
  --accent: #16a34a;
  --accent-soft: #e9f7ee;
  --hover: #f3f4f6;
  --shadow: 0 10px 34px rgba(20, 25, 40, 0.12);
  --node-fill: #ffffff;
  --node-border: #4a4a4a;
  --label-fill: rgba(0, 0, 0, 0.05);
  --label-ink: #1f2329;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--panel);
}

ul,
li {
  list-style: none;
  margin: 0;
  padding: 0;
}

label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 1px 0;
  white-space: nowrap;
  cursor: pointer;
}

input[type="number"] {
  width: 4.5em;
  font: inherit;
  padding: 4px 6px;
  border: 1px solid #d8dce3;
  background: #fff;
  color: var(--ink);
  -moz-appearance: textfield;
  appearance: textfield;
  transition: border-color 0.15s, box-shadow 0.15s;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

button {
  font: inherit;
  cursor: pointer;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--panel);
  color: var(--ink);
  border-bottom: 1px solid var(--line);
}

.body {
  display: flex;
  flex: 1;
  min-height: 0;
  position: relative;
}

.panel {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background: var(--panel);
}

.tree-panel {
  flex: 0 0 320px;
  min-width: 320px;
  border-right: 1px solid var(--line);
}

.inspector-panel {
  width: 320px;
  flex: 0 0 320px;
  max-width: 320px;
  min-width: 320px;
  overflow-x: hidden;
  border-left: 1px solid var(--line);
}

.stage {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  gap: 1px;
  overflow: hidden;
  background-color: var(--background-color);
  background-image: radial-gradient(circle, #e1e4e9 1px, transparent 1px);
  background-size: 24px 24px;
}

.viewer {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  overflow: hidden;
}

.viewer-title-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 12px;
  background: #fafbfc;
  border-bottom: 1px solid var(--line);
}

.viewer-title-text {
  font-weight: 600;
  font-size: 12px;
  white-space: nowrap;
}

.viewer-title-info {
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.viewer-viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  background-color: var(--background-color);
  /* Prevent text selection while dragging the canvas. We intentionally do
     NOT call preventDefault() on the viewport mousedown (see
     makeViewportDragHandler) so that a focused inspector input can blur
     natively when the user clicks the canvas. */

  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

.viewer-viewport:active {
  cursor: grabbing;
}

.viewport-world {
  position: relative;
}

/* ===== drag overlays (typed Karax, no emit) =====
   A transparent layer shown only while a node is dragged or the canvas is
   being panned. It captures the pointer so the move/up handlers stay ordinary typed
   Karax event procs. */
.drag-overlay {
  position: fixed;
  inset: 0;
  z-index: 2147483647;
  cursor: move;
}

.drag-overlay.hidden {
  display: none;
  pointer-events: none;
}

.drag-overlay.is-dragging {
  cursor: grabbing;
}

.toolbar {
  display: flex;
  flex: 1 1 auto;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.tool {
  margin: 0;
  padding: 5px 11px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  font-size: 12px;
}

.tool:hover {
  background: var(--hover);
  border-color: #dcdfe4;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--ink);
  font-size: 12px;
  cursor: pointer;
}

.toggle input {
  accent-color: var(--accent);
  flex: 0 0 auto;
  margin: 0;
}

/* Anchor: the two stretch toggles (Horizontal / Vertical) stack vertically
   beside the 3x3 picker, each carrying its own direction glyph (↔ / ↕). The
   toggles grow to fill the column height (matched to the picker by the parent
   `.anchor-row`'s align-items: stretch) so the row stays top/bottom aligned. */

  display: flex;
  flex-direction: column;
  gap: 3px;
  justify-content: flex-start;
}

.axis-stretch .toggle {
  flex: 1;
}

.separator {
  width: 1px;
  height: 18px;
  background: var(--line);
  margin: 0 3px;
}

.panel-title {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 12px 12px 6px;
  position: sticky;
  top: 0;
  background: var(--panel);
  z-index: 5;
}

.tree {
  padding-bottom: 12px;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

.tree-row {
  display: flex;
  align-items: stretch;
  min-height: 22px;
}

.caret {
  flex: 0 0 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  cursor: pointer;
  font-size: 10px;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

.caret:hover {
  color: var(--accent);
}

.caret.empty {
  cursor: default;
  visibility: hidden;

.tree-node {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  padding: 3px 9px;
  margin: 1px 7px 1px 0;
  white-space: nowrap;
  text-overflow: ellipsis;
  cursor: grab;
  font-variant-numeric: tabular-nums;
  color: #424a52;
}

.tree-node:hover {
  background: var(--hover);
}

.tree-node.focus {
  background: var(--accent-soft);
  color: #13632e;
  font-weight: 600;

.tree-node.sel {
  background: #e7f1ea;
  color: #2f7a47;

  outline-offset: -2px;
  background: var(--accent-soft);
}

.tree-id {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 11px;
}

.tree-name {
  flex: 0 0 auto;
  margin-left: 7px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tree-child-count {
  flex: 0 0 auto;
  margin-left: 6px;
  min-width: 16px;
  text-align: center;
  padding: 0 5px;
  font-size: 10px;
  line-height: 15px;
  color: var(--muted);
  background: #eef0f3;

.inspector {
  display: block;
  padding-bottom: 8px;

.group {

/* A node box, shared by BOTH the Buju (absolute) and Html5 (flex) renderers.
   Border + number live on THIS one element (no fill, so nodes are transparent
   wireframes), so the two sides can never drift apart — there is no separate
   border / number layer to misalign. Zoom and drag are applied entirely in Nim
   (every node length is pre-multiplied by `zoom` before it reaches the DOM), so
   there is NO CSS `transform: scale`. The outline and number are therefore just

   identical for Buju and Html5. The outline (not a border) is deliberate: an

  -moz-user-select: none;
  -ms-user-select: none;

   inset by padding, the number at the top-left is always visible. */

  position: absolute;
  top: 0;
  left: 0;
  font-size: 11px;
  line-height: 1;
  padding: 0 2px;
  white-space: nowrap;
  background: var(--label-fill);
  color: var(--label-ink);
  pointer-events: none;
  z-index: 2147483640;
}

.node-label.focus {

  color: #fff;

/* Absolutely-positioned node (Buju renderer): placed by explicit left/top in
   the world coordinate space. */

  position: absolute;
}

/* Flex-laid-out node (Html5 renderer): a flex child that also establishes a
   positioned context so its number can anchor to its own top-left. */
.flex-node {
  position: relative;
  flex-shrink: 0;
  box-sizing: border-box;
}


/* Every alignment / layout diagram reuses ONE drawn language: a white box
   (.glyph) filled with green blocks (.glyph-block), arranged by flex. Row =

/* 3x3 anchor picker (Free layout) */
.anchor-picker {

.glyph.ac-evenly { align-content: space-evenly; }

.glyph .glyph-block {
  width: 4px;
  height: 20px;
  background: var(--accent);
  flex: 0 0 auto;

/* cross axis: the main-axis vertical bar rotated to a horizontal bar, stacked
   in a column and distributed by justify-content (Start/Middle/End = top /
   centred / bottom). */

  width: 20px;
  height: 4px;
}

/* cross stretch: bars grow to fill the column's vertical space (flex:1 1 0 on
   the main axis); the fixed 20px width stays centred via align-self:center. */

  height: auto;
  flex: 1 1 0;
  align-self: center;
}

/* line align (wrap): three 13×4 bars stacked vertically (column), their
   vertical spread driven by justify-content so the alignContent values read
   clearly. Bar LENGTH matches the other axis icons (20px); stretch swaps
   align-items to stretch so the bars grow across the width instead. */
.glyph.line-align .glyph-block {
  width: 20px;
  height: 4px;
  flex: 0 0 auto;
}

/* stretch: align-content:stretch makes the wrapped lines grow to fill the
   vertical space, so the thin bars become three thick blocks. flex:1 1 0 on
   the main (vertical) axis fills the container; the fixed 20px width keeps

  flex: 1 1 0;
  align-self: center;
}

/* Used by Size · Gap, Margin and Padding so they share one compact look. */
